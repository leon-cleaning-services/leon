name: Build & Verify

on: [ pull_request, workflow_dispatch ]

# Every job gets read-only unless it says otherwise below.
permissions:
  contents: read

# A new push to a pull request makes the run for the previous commit pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Comments the artifact link on the pull request.
    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build and test app
        run: ./gradlew check build

      - uses: actions/upload-artifact@v7
        id: upload-artifact
        with:
          name: Android artifacts
          path: |
            androidApp/build/outputs/apk/**/*.apk
            androidApp/build/outputs/bundle/**/*.aab

      - name: Comment artifact link on pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '📦 Build artifacts are available [here](${{ steps.upload-artifact.outputs.artifact-url }}).',
            })

  package-desktop:
    permissions:
      contents: read
    uses: ./.github/workflows/package-desktop.yml
