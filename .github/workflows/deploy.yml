name: Deploy

on:
  push:
    tags:
      - v*
  workflow_dispatch:

# Every job gets read-only unless it says otherwise below. Only the two jobs that write to
# this repository - the release and the version bump - get contents: write; the jobs holding
# the signing keystore and the Play Store service account do not.
permissions:
  contents: read

jobs:
  package-desktop:
    permissions:
      contents: read
    uses: ./.github/workflows/package-desktop.yml

  build-android:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Reveals the upload keystore and signing.properties.
      - uses: ./.github/actions/reveal-secrets
        with:
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Build release APK & AAB
        run: ./gradlew assembleRelease bundleRelease

      - uses: actions/upload-artifact@v7
        with:
          name: Android artifacts
          path: |
            androidApp/build/outputs/apk/**/*.apk
            androidApp/build/outputs/bundle/**/*.aab

  play-store:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: build-android
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Setup Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3'
          bundler-cache: true

      # Reveals google-play-service-account.json.
      - uses: ./.github/actions/reveal-secrets
        with:
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}

      - uses: actions/download-artifact@v7
        with:
          name: Android artifacts
          path: androidApp/build/outputs

      - name: Deploy production version
        run: bundle exec fastlane deploy
        env:
          # The AAB comes from the build-android job, so the lane must not rebuild it.
          SKIP_GRADLE_BUILD: 'true'

  github-release:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: [build-android, package-desktop]
    permissions:
      contents: write # Creates the GitHub release.
      pull-requests: read # The changelog builder reads the merged pull requests and their labels.
    steps:
      # The only job that needs full history: the changelog builder resolves the previous tag.
      # The build itself does not - versionCode/versionName are literals in build.gradle.kts
      # since 10797c9 replaced latestTagName() with a hardcoded value.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          show-progress: false

      - name: Build changelog
        id: github_release
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          configurationJson: |
            {
              "categories": [
                {
                  "title": "## 🚀 Features",
                  "labels": ["feature"]
                },
                {
                  "title": "## 🐛 Fixes",
                  "labels": ["bug", "fix"]
                },
                {
                  "title": "## 🔧 Maintenance",
                  "labels": ["chore", "maintenance"]
                },
                {
                  "title": "## ⬆️ Dependencies",
                  "labels": ["dependencies"]
                },
                {
                  "title": "## 📚 Documentation",
                  "labels": ["documentation"]
                },
                {
                  "title": "## 🧪 Tests",
                  "labels": ["test"]
                }
              ],
              "tag_resolver": {
                "method": "sort"
              }
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v7
        with:
          pattern: desktop-*
          merge-multiple: true
          path: desktop-artifacts

      - uses: actions/download-artifact@v7
        with:
          name: Android artifacts
          path: android-artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{steps.github_release.outputs.changelog}}
          files: |
            android-artifacts/**/*.apk
            android-artifacts/**/*.aab
            desktop-artifacts/**

  increment-version:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: [play-store, github-release]
    permissions:
      contents: write # Commits the incremented version to main.
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Increment version code
        run: sed -i 's/versionCode = [0-9]*/versionCode = '$(awk '/versionCode =/{print $3=$3+1}' androidApp/build.gradle.kts)'/g' androidApp/build.gradle.kts

      - name: Increment version name
        run: sed -i 's/versionName = .*/versionName = "'$(awk '/versionName =/{print substr($3,2,length($3)-2)+1}' androidApp/build.gradle.kts)'"/g' androidApp/build.gradle.kts

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: '[skip ci] Increment version code & name for next release'
          branch: main
