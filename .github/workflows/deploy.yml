name: Deploy

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag to deploy, e.g. v70.0.0.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to deploy, e.g. v70.0.0. Run this workflow from the release commit.
        required: true
        type: string

# Every job gets read-only unless it says otherwise below. Only the job that writes to
# this repository - the release - gets contents: write; the jobs holding
# the signing keystore and the Play Store service account do not.
permissions:
  contents: read

jobs:
  package-desktop:
    permissions:
      contents: read
    uses: ./.github/workflows/package-desktop.yml

  build-android:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Reveals the upload keystore and signing.properties.
      - uses: ./.github/actions/reveal-secrets
        with:
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Build release APK & AAB
        run: ./gradlew assembleRelease bundleRelease

      - uses: actions/upload-artifact@v7
        with:
          name: Android artifacts
          path: |
            androidApp/build/outputs/apk/**/*.apk
            androidApp/build/outputs/bundle/**/*.aab

  play-store:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: build-android
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Setup Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4'
          bundler-cache: true

      # Reveals google-play-service-account.json.
      - uses: ./.github/actions/reveal-secrets
        with:
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}

      - uses: actions/download-artifact@v8
        with:
          name: Android artifacts
          path: androidApp/build/outputs

      - name: Deploy production version
        run: bundle exec fastlane deploy
        env:
          # The AAB comes from the build-android job, so the lane must not rebuild it.
          SKIP_GRADLE_BUILD: 'true'

  github-release:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: [build-android, package-desktop]
    permissions:
      contents: write # Uploads the assets to the release.
    # No checkout: gh addresses the release through --repo.
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: desktop-artifacts

      - uses: actions/download-artifact@v8
        with:
          name: Android artifacts
          path: android-artifacts

      # release-please already created the release and its tag; this only attaches the artifacts.
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          mapfile -t files < <(find android-artifacts -name '*.apk' -o -name '*.aab'; find desktop-artifacts -type f)
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
