name: Release Please

on:
  push:
    branches:
      - main

# Every job gets read-only unless it says otherwise below.
permissions:
  contents: read

# Runs must not overlap: each one rewrites the release PR from the state of main.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      # A GitHub App token instead of GITHUB_TOKEN, so that the release PR triggers CI. It is
      # minted per run and expires after an hour, unlike a personal access token.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # release-please tags each release vXX.0.0 when it creates it, which is also how it finds
      # the previous release when it builds the next release PR - so the release is created
      # straight away, not as a draft. deploy.yml attaches the build artifacts to it afterwards.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

  # release-please cannot do arithmetic on versionCode, so it is incremented here, on the
  # release PR branch. This is idempotent: release-please rebuilds the branch from main on
  # every run, and this job then applies the bump again.
  bump-version-code:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.pr != '' }}
    permissions:
      contents: read
    steps:
      # Its own App token, since the release-please job's token is not passed between jobs. The
      # push is made with it so that CI runs on the final state of the PR.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          token: ${{ steps.app-token.outputs.token }}
          show-progress: false

      - name: Increment version code
        run: |
          git fetch --depth=1 origin main
          base=$(git show origin/main:version.properties | sed -n 's/^versionCode=//p')
          new=$((base + 1))
          sed -i "s/^versionCode=.*/versionCode=$new/" version.properties
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: increment versionCode to $new"
          git push

  # Called directly rather than through a tag trigger, so that the release, the Play Store upload
  # and the artifacts all come from this one run and its outputs.
  deploy:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
    secrets: inherit
