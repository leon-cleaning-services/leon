name: Label Weblate PRs

# Every pull request needs exactly one label (see AGENTS.md), and Weblate cannot set one itself.
# pull_request_target, because Weblate opens its pull requests from a fork, whose GITHUB_TOKEN
# could not write labels. It is safe here: the job never checks out or runs the fork's code.
on:
  pull_request_target:
    types:
      - opened
      - reopened

permissions: {}

jobs:
  label:
    if: github.event.pull_request.user.login == 'weblate'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Add the chore label
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/labels" -f "labels[]=chore"
